{% extends "base.html" %}{% block content %}
<div class="pagehead"><div><span class="tag">TRANSACTIONS</span><h1>Income & Expenses</h1></div></div>
<div class="grid"><section class="panel"><h3>Add Transaction</h3><form method="post">
<label>Date</label><input name="date" type="date" value="{{today}}" required>
<label>Description</label><input id="desc" name="description" placeholder="e.g. Swiggy dinner 450" required>
<label>Amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required>
<label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
<label>Category <small>(leave blank for AI prediction)</small></label><select name="category"><option value="">AI Predict</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select>
<button class="btn">Save Transaction</button></form></section>
<section class="panel"><h3>Transaction History</h3><table><tr><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th>Amount</th><th></th></tr>
{% for t in transactions %}<tr><td>{{t.date}}</td><td>{{t.description}}</td><td>{{t.type}}</td><td>{{t.category}}</td><td>₹{{"{:,.2f}".format(t.amount)}}</td><td><form method="post" action="{{url_for('delete_transaction',tid=t.transaction_id)}}"><button class="delete">Delete</button></form></td></tr>{% endfor %}
</table></section></div>
{% endblock %}
