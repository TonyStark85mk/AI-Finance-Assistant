<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Finance Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav>
<a class="brand" href="{{ url_for('index') }}">AI Finance Assistant</a>
{% if session.get('user_id') %}
<div class="navlinks"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('transactions') }}">Transactions</a><a href="{{ url_for('budgets') }}">Budgets</a><a href="{{ url_for('logout') }}">Logout</a></div>
{% else %}<div><a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('register') }}">Register</a></div>{% endif %}
</nav>
<main>
{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<div>{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
